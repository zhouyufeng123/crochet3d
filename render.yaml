services:
  - type: web
    name: crochet3d
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: AHOLO_API_KEY
        sync: false
      - key: ACCESS_PASSWORD
        sync: false
